name: AZ Alpha Vision - Live Market Quotes

on:
  workflow_dispatch:
  schedule:
    # تحديث دوري للأسعار خلال أيام الأسبوع؛ GitHub قد يؤخر الجدولة قليلًا.
    - cron: '*/15 * * * 1-5'

permissions:
  contents: read

jobs:
  live_quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-cache-dir yfinance pandas numpy requests
      - name: Refresh live quotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_PRICE: '1'
          MAX_PRICE: '5000'
          YF_BATCH_SIZE: '50'
        run: python fetch_market_data.py --mode quick
