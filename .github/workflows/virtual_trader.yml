name: AZ Alpha Vision - Virtual Trader Background

on:
  workflow_dispatch:
  schedule:
    # كل 15 دقيقة خلال نافذة تغطي الساعات الممتدة بتوقيت نيويورك في كلا نظامي DST.
    # التنفيذ الفعلي يُحسم داخل المحرك (قبل التداول / الجلسة / بعد التداول / إجازة).
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 6'

permissions:
  contents: read

jobs:
  run-virtual-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run educational virtual trader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_RUN_KEY: ${{ secrets.NOTIFY_RUN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$NOTIFY_RUN_KEY" || { echo "Missing NOTIFY_RUN_KEY"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/run-virtual-trader" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-trader-key: $NOTIFY_RUN_KEY" \
            --data '{}'
