name: AZ Alpha Vision - Um Zaki Intro Broadcast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Broadcast Um Zaki intro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_RUN_KEY: ${{ secrets.NOTIFY_RUN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${NOTIFY_RUN_KEY:-}"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/um-zaki-intro" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-notify-key: $NOTIFY_RUN_KEY" \
            --data '{}'
