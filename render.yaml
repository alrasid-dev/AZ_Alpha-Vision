services:
  - type: cron
    name: az-alpha-vision-unified-marketer
    runtime: node
    repo: https://github.com/alrasid-dev/AZ_Alpha-Vision.git
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLISH_MODE
        value: publish
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
