name: AZ Alpha Vision - Full Market Scan

on:
  schedule:
    # 22:00 UTC كل يوم عمل — بعد إغلاق السوق الأمريكي بوقت كافٍ (أيام الإثنين-الجمعة)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

jobs:
  full_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "finvizfinance>=1.3.0,<2.0.0" "yfinance>=0.2.54,<2.0.0" "pandas>=2.2.3,<3.0.0" "numpy>=1.26.4,<3.0.0" "requests>=2.31.0,<3.0.0"

      - name: Run full scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_UNIVERSE: '2500'
        run: python fetch_market_data.py --mode full
