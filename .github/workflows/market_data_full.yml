name: AZ Alpha Vision - Full Market Scan

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

jobs:
  full_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free market data dependencies
        run: pip install --upgrade yfinance pandas numpy requests

      - name: Run free full market scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_UNIVERSE: '10000'
          MIN_PRICE: '5'
          MAX_PRICE: '70'
          YF_BATCH_SIZE: '50'
        run: python fetch_market_data.py --mode full
